<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Visita Virtual dos Polos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
        }

        .header-box {
            text-align: center;
        }

        .brand-logo {
            height: 50px;
            margin-bottom: 24px;
            object-fit: contain;
        }

        h2 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        p { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 28px; }

        /* Estilização do Formulário Manual */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 18px;
            display: none;
            padding: 12px;
            background-color: #fef2f2;
            border-radius: 6px;
            border: 1px solid #fee2e2;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-box">
            <img src="logo-unifecaf.png.png" alt="Logo UniFECAF" class="brand-logo">
            <h2>Acesso ao Painel</h2>
            <p>Insira suas credenciais administrativas</p>
        </div>

        <!-- FORMULÁRIO INTEGRADO AO SEU SCRIPT.JS -->
        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail Corporativo</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="exemplo@unifecaf.com.br" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
            </button>
        </form>

        <!-- Mensagem de feedback de erro gerenciada pelo Script -->
        <div id="msg-erro" class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i> E-mail ou senha incorretos!
        </div>
    </div>

    <!-- Vinculação ao script do painel principal para rodar as validações -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const formLogin = document.getElementById("form-login");
        
        if (formLogin) {
            formLogin.addEventListener("submit", function (e) {
                e.preventDefault(); 
                
                const emailDigitado = document.getElementById("email").value.trim();
                const senhaDigitada = document.getElementById("senha").value;
                const msgErro = document.getElementById("msg-erro");

                // ==========================================
                // CONFIGURAÇÃO DOS USUÁRIOS PERMITIDOS
                // ==========================================
                const usuariosPermitidos = [
                    { email: "regulatorio@fecaf.com.br", senha: "fecaf2026" },
                    { email: "paulo.santos@fecaf.com.br", senha: "fecaf2026" },
                    { email: "euvas.santos@fecaf.com.br", senha: "fecaf2026" },
                    { email: "thayna.oliveira@fecaf.com.br", senha: "fecaf2026" },
                    { email: "yago.brito@fecaf.com.br", senha: "fecaf2026" }
                ];

                // Varre a lista procurando se existe um e-mail e senha correspondentes
                const usuarioValido = usuariosPermitidos.find(u => u.email === emailDigitado && u.senha === senhaDigitada);

                if (usuarioValido) {
                    localStorage.setItem("painel_polos_logado", "true");
                    window.location.href = "index.html"; // Vai para o painel
                } else {
                    if (msgErro) msgErro.style.display = "block";
                }
            });
        }
    });
</script>
